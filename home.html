<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/geist.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #0a0a0a;
        color: #ededed;
        font-family: "Geist", system-ui, sans-serif;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      canvas {
        width: min(72vw, 320px);
        height: min(72vw, 320px);
        background: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 12px;
      }

      .label {
        user-select: none;
      }

      .label span {
        opacity: 0;
        animation: letter 2.8s ease-in-out infinite;
      }

      .label span:nth-child(1) {
        animation-delay: 0s;
      }

      .label span:nth-child(2) {
        animation-delay: 0.4s;
      }

      .label span:nth-child(3) {
        animation-delay: 0.8s;
      }

      .label span:nth-child(4) {
        animation-delay: 1.2s;
      }

      .label span:nth-child(5) {
        animation-delay: 1.6s;
      }

      .label span:nth-child(6) {
        animation-delay: 2s;
      }

      .label span:nth-child(7) {
        animation-delay: 2.4s;
      }

      @keyframes letter {
        0%,
        20%,
        100% {
          opacity: 0;
        }

        40%,
        60% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="blob" width="96" height="96" aria-hidden="true"></canvas>
    <p class="label" aria-label="loading"><span>l</span><span>o</span><span>a</span><span>d</span><span>i</span><span>n</span><span>g</span></p>

    <script>
      const canvas = document.getElementById("blob");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      const BG = [0, 0, 0];
      const PALETTE = [
        [0, 0, 0],
        [40, 72, 200],
        [200, 50, 62],
        [230, 100, 36],
        [240, 190, 52],
      ];

      const BAYER = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5],
      ];

      const image = ctx.createImageData(W, H);
      const pixels = image.data;

      function noise(x, y, t) {
        return (
          Math.sin(x * 12.9898 + y * 78.233 + t * 0.9) *
          Math.cos(y * 4.17 - x * 3.31 + t * 1.4)
        );
      }

      function pickPalette(shade, band, glitch) {
        const v = shade + band * 0.55 + glitch * 0.35;
        if (v < 0.08) return 0;
        if (v < 0.34) return 1;
        if (v < 0.52) return 2;
        if (v < 0.72) return 3;
        return 4;
      }

      function setPixel(x, y, rgb) {
        const i = (y * W + x) * 4;
        pixels[i] = rgb[0];
        pixels[i + 1] = rgb[1];
        pixels[i + 2] = rgb[2];
        pixels[i + 3] = 255;
      }

      let t = 0;

      function draw() {
        const lightX = Math.cos(t * 0.65);
        const lightY = Math.sin(t * 0.52) * 0.35;
        const lightZ = 0.65;

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const nx = (x / (W - 1)) * 2 - 1;
            const ny = (y / (H - 1)) * 2 - 1;
            const r = Math.hypot(nx, ny);
            const wobble = noise(nx, ny, t) * 0.08;
            const edge = 0.92 + wobble;
            const dither = (BAYER[x & 3][y & 3] + 0.5) / 16 - 0.5;

            if (r > edge + dither * 0.12) {
              setPixel(x, y, BG);
              continue;
            }

            let z = 0;
            if (r < 1) {
              z = Math.sqrt(Math.max(0, 1 - r * r));
            }

            const nx3 = nx / Math.max(r, 0.001);
            const ny3 = ny / Math.max(r, 0.001);
            const shade =
              (nx3 * lightX + ny3 * lightY + z * lightZ + 1) * 0.5;
            const band = Math.exp(-Math.pow(ny * 2.2, 2)) * 0.9;
            const glitch =
              Math.abs(noise(nx * 3, ny * 3, t * 2.1)) *
              Math.max(0, r - 0.55);

            const idx = pickPalette(shade, band, glitch);
            const color = PALETTE[idx];

            if (r > edge - 0.08 && Math.random() < 0.18) {
              const scatter = PALETTE[(idx + 1 + (x + y + t | 0)) % 5];
              setPixel(x, y, scatter);
            } else {
              setPixel(x, y, color);
            }
          }
        }

        ctx.putImageData(image, 0, 0);
        t += 0.016;
        requestAnimationFrame(draw);
      }

      draw();
    </script>
  </body>
</html>
